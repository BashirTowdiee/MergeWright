<section class="page" id="commands" data-title="Commands" data-crumb="Projects / MergeWright / Commands">
          <div class="grid-2">
            <div class="card">
              <div class="card-header"><div><h2>Command launcher</h2><p class="muted">CLI-equivalent workflows via API</p></div><span class="pill blue">POST /api/cli/commands</span></div>
              <div class="card-body list">
                <div class="field"><label>Command</label><select id="commandSelect"><option value="continue-run">continue-run</option><option value="run">run</option><option value="prove">prove</option><option value="report-run">report-run</option><option value="compare-runs">compare-runs</option><option value="review-modes">review-modes</option><option value="check-write-safety">check-write-safety</option><option value="probe-opencode">probe-opencode</option><option value="run-stage">run-stage</option><option value="run-stages">run-stages</option><option value="continue-stages">continue-stages</option><option value="accept-stage">accept-stage</option><option value="fix-stage">fix-stage</option><option value="reassess-stage-plan">reassess-stage-plan</option></select></div>
                <div class="field"><label>Run ID</label><input id="commandRunIdInput" class="input" /></div>
                <div class="field"><label>Stage name (run)</label><input id="commandStageNameInput" class="input" value="stage-01-example" /></div>
                <div class="field"><label>Stage ID (fix-stage)</label><input id="commandStageIdInput" class="input" value="stage-01-example" /></div>
                <div class="field"><label>Stage plan path (fix-stage)</label><input id="commandStagePlanInput" class="input" value=".artifacts/runs/example/stage-plan.json" /></div>
                <div class="field"><label>Compare run B (compare-runs)</label><input id="commandCompareRunIdInput" class="input" /></div>
                <div class="field"><label>Modes (review-modes)</label><input id="commandModesInput" class="input" value="architecture,tests,docs,maintainability" /></div>
                <div class="field"><label>Config</label><input id="commandConfigInput" class="input" value="config.example.json" /></div>
                <div class="field"><label><input type="checkbox" id="commandStopAfterEachStage" checked /> Stop after each stage (run-stages)</label></div>
                <div class="field"><label><input type="checkbox" id="commandAutoCommit" /> Auto-commit (accept-stage)</label></div>
                <div class="field"><label>Commit message (accept-stage)</label><input id="commandCommitMessageInput" class="input" value="" /></div>
                <div class="field"><label><input type="checkbox" id="commandReassessDownstream" /> Reassess downstream after fix-stage</label></div>
                <div class="field"><label>Execution mode</label><select id="commandExecutionMode"><option value="preview-first">Preview first</option><option value="read-only">Read-only execute</option><option value="write-enabled">Write-enabled with confirmation</option></select></div>
                <div class="field"><label><input type="checkbox" id="commandConfirmWrites" /> Confirm write-enabled execution</label></div>
                <div class="field"><label>Instruction</label><textarea id="commandInstructionInput">Fix only stale roadmap wording. Web app is the main interface for CLI workflows. TUI is superseded.</textarea></div>
                <div class="toolbar"><span class="pill amber" id="commandRiskPill">medium risk</span><button class="button" id="executeCommandButton">Preview command</button></div>
                <pre id="commandPreview">Select a command to preview.</pre>
              </div>
            </div>

            <div class="card">
              <div class="card-header"><h2>Command output</h2><span class="pill neutral">typed</span></div>
              <div class="card-body list">
                <div class="tabs"><button class="tab active" data-tab="typed-result">Typed result</button><button class="tab" data-tab="cli-summary">CLI summary</button><button class="tab" data-tab="events">Events</button></div>
                <div id="typed-result" class="tab-panel active"><pre id="typedResultOutput">No command executed yet.</pre></div>
                <div id="cli-summary" class="tab-panel"><pre id="cliSummaryOutput">No CLI summary yet.</pre></div>
                <div id="events" class="tab-panel"><pre id="eventsOutput">No events yet.</pre></div>
              </div>
            </div>
          </div>
        </section>
