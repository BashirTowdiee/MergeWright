name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - docs/product-delivery-pack

jobs:
  build-test-docs:
    name: Build, test, and docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install docs site dependencies
        run: npm --prefix docs-site install

      - name: Build CLI
        run: npm run build

      - name: Test CLI
        run: npm test

      - name: Check docs site
        run: npm run docs:check

      - name: Build docs site
        run: npm run docs:build
