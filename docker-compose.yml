services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api-dev
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3040"
      ORCHESTRATOR_ROOT: /workspace
    ports:
      - "3040:3040"
    volumes:
      - .:/workspace
      - mergewright_node_modules:/workspace/node_modules
      - mergewright_artifacts:/workspace/.artifacts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3040/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web-dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      API_PROXY_TARGET: http://api:3040
    ports:
      - "3050:3050"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/workspace
      - mergewright_node_modules:/workspace/node_modules

  docs:
    build:
      context: .
      dockerfile: docs-site/Dockerfile
    ports:
      - "4321:4321"
    volumes:
      - ./docs-site:/workspace/docs-site
      - mergewright_docs_node_modules:/workspace/docs-site/node_modules

volumes:
  mergewright_node_modules:
  mergewright_docs_node_modules:
  mergewright_artifacts:
